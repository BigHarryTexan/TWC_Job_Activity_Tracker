name: Generate TWC Reports

on:
  schedule:
    - cron: "0 8 */14 * 1"  # Every second Monday at 08:00 UTC
  workflow_dispatch:
  repository_dispatch:
    types: [generate_twoweek_report, generate_full_report]

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install python-dateutil pandas

      # -------------------------------
      # Two-week report
      # -------------------------------
      - name: Generate Two-Week Report
        if: github.event.action == 'generate_twoweek_report'
        run: python scripts/generate_report.py

      # -------------------------------
      # Full-history report
      # -------------------------------
      - name: Generate Full Report
        if: github.event.action == 'generate_full_report'
        run: python scripts/generate_report.py --full

      - name: Commit reports
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add reports/*.html
          git commit -m "Auto-generated TWC reports" || echo "No changes"
          git push
